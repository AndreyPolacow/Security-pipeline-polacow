name: Security pipeline - supply chain focus

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  action-supply-chain-audit:
    name: Audit GitHub Actions usage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install zizmor
        run: |
          python -m pip install --upgrade pip
          python -m pip install zizmor
      - name: Run zizmor audit
        run: |
          mkdir -p reports
          zizmor . --format json > reports/zizmor.json || true
      - name: Upload workflow audit report
        uses: actions/upload-artifact@v4
        with:
          name: workflow-audit-polyakov
          path: reports/zizmor.json

  python-security:
    name: Python SAST and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit semgrep detect-secrets
      - name: Run Bandit
        run: |
          mkdir -p reports
          bandit -r src -f json -o reports/bandit.json || true
      - name: Run pip-audit
        run: pip-audit -r requirements.txt -f json -o reports/pip-audit.json || true
      - name: Run Semgrep custom rules
        run: semgrep scan --config semgrep/rules.yml --json --output reports/semgrep.json || true
      - name: Run detect-secrets
        run: detect-secrets scan . > reports/detect-secrets.json || true
      - name: Upload Python security reports
        uses: actions/upload-artifact@v4
        with:
          name: python-security-reports-polyakov
          path: reports/

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended,security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: table
          exit-code: 0
          ignore-unfixed: true
          scanners: vuln,secret,misconfig
          output: trivy-results.txt
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-polyakov
          path: trivy-results.txt
